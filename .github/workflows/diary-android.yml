name: Diary System Android

on:
  workflow_dispatch:
    inputs:
      source_ref: {description: Private source main or a full commit SHA contained in main, required: true, default: main}
      version: {description: X.Y.Z or auto, required: true, default: auto}
      publish: {description: Publish release, required: true, type: boolean, default: false}

concurrency: {group: diary-system-android-release, cancel-in-progress: false}
permissions: {contents: write}

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: diary-system-release
    steps:
      - name: Check out public orchestration
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}

      - name: Generate Diary Source Reader installation token
        id: source_reader
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.DIARY_SOURCE_READER_APP_ID }}
          private-key: ${{ secrets.DIARY_SOURCE_READER_APP_PRIVATE_KEY }}
          owner: zcx80279-collab
          repositories: Magic-Rabbit--K2
          permission-contents: read
          permission-metadata: read

      - name: Resolve and trust private source revision
        id: source
        env: {GH_TOKEN: '${{ steps.source_reader.outputs.token }}', REQUESTED_REF: '${{ inputs.source_ref }}'}
        run: |
          set -euo pipefail
          if [ "$REQUESTED_REF" = main ]; then
            source_sha=$(gh api repos/zcx80279-collab/Magic-Rabbit--K2/commits/main --jq .sha)
          elif [[ "$REQUESTED_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            source_sha=$(gh api "repos/zcx80279-collab/Magic-Rabbit--K2/commits/$REQUESTED_REF" --jq .sha)
            status=$(gh api "repos/zcx80279-collab/Magic-Rabbit--K2/compare/${source_sha}...main" --jq .status)
            case "$status" in ahead|identical) ;; *) echo "::error::The source commit is not contained in private main."; exit 1;; esac
          else
            echo "::error::source_ref must be main or a full commit SHA."; exit 1
          fi
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Check out private Diary System source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: zcx80279-collab/Magic-Rabbit--K2
          ref: ${{ steps.source.outputs.sha }}
          token: ${{ steps.source_reader.outputs.token }}
          persist-credentials: false
          fetch-depth: 1
          path: .source/diary-system

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '24'}

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with: {distribution: temurin, java-version: '21'}

      - name: Resolve monotonic version
        id: version
        env: {GITHUB_TOKEN: '${{ github.token }}'}
        run: node scripts/diary-resolve-version.mjs android '${{ inputs.version }}'

      - name: Scan private source before secrets are restored
        run: bash scripts/security-scan.sh .source/diary-system

      - name: Restore existing encrypted signing keystore in runner temp
        id: signing
        working-directory: .source/diary-system
        env:
          SIGNING_KEY_ENCRYPTION_PASSWORD: ${{ secrets.DIARY_SIGNING_KEY_ENCRYPTION_PASSWORD }}
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/diary-signing"
          install -d -m 700 "$stage"
          enc_file=""
          for candidate in "signing/signing-secrets.enc" "signing-secrets.enc" "android/signing-secrets.enc" "android/app/signing-secrets.enc"; do
            if [ -f "$candidate" ]; then
              enc_file="$PWD/$candidate"
              break
            fi
          done
          test -n "$enc_file"
          node scripts/restore-android-signing-key.mjs --enc-file "$enc_file" --out "$stage/diary-release.jks" --write-github-env
          chmod 600 "$stage/diary-release.jks"
          echo "stage=$stage" >> "$GITHUB_OUTPUT"

      - name: Validate restored keystore integrity
        working-directory: .source/diary-system
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ env.RESOLVED_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ env.RESOLVED_KEY_ALIAS }}
        run: |
          set -euo pipefail
          node scripts/verify-android-keystore.mjs \
            --keystore "$RUNNER_TEMP/diary-signing/diary-release.jks" \
            --auto-alias \
            --write-github-env \
            --write-summary \
            --summary-title "Diary System Android Release Keystore"

      - name: Install dependencies and build web application
        working-directory: .source/diary-system
        env:
          VITE_GITHUB_REPO: ${{ github.repository }}
        run: |
          npm install
          npm run build

      - name: Generate Android project and release APK
        working-directory: .source/diary-system
        env:
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.versionCode }}
          ANDROID_VERSION_NAME: ${{ steps.version.outputs.version }}
          ANDROID_KEYSTORE_TYPE: ${{ env.RESOLVED_KEYSTORE_TYPE }}
          ANDROID_KEY_ALIAS: ${{ env.RESOLVED_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ env.RESOLVED_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ env.RESOLVED_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          rm -rf android
          npx cap add android
          npm install -D @capacitor/assets
          npx @capacitor/assets generate --android
          npx cap sync android
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/diary-signing/diary-release.jks"
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Verify signed APK certificate matches restored keystore
        working-directory: .source/diary-system
        env:
          EXPECTED_KEYSTORE_SHA1: ${{ env.RESOLVED_KEYSTORE_SHA1 }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          apksigner="$(find "$sdk_root/build-tools" -maxdepth 2 -name apksigner -type f 2>/dev/null | sort -V | tail -n 1 || true)"
          test -n "$apksigner"
          apk_cert="$("$apksigner" verify --print-certs "$apk" 2>&1)"
          raw_sha1="$(printf '%s\n' "$apk_cert" | sed -n 's/.*SHA-1 digest:[[:space:]]*//p' | head -n 1 | tr -d '[:space:]')"
          formatted_sha1="$(printf '%s' "$raw_sha1" | tr '[:lower:]' '[:upper:]' | sed 's/../&:/g; s/:$//')"
          if [ -n "${EXPECTED_KEYSTORE_SHA1:-}" ] && [ "$formatted_sha1" != "$EXPECTED_KEYSTORE_SHA1" ]; then
            echo "::error::APK SHA-1 ($formatted_sha1) does not match restored keystore SHA-1 ($EXPECTED_KEYSTORE_SHA1)."
            exit 1
          fi
          if unzip -Z1 "$apk" | grep -Eiq '(^|/)(.*\.(jks|keystore|p12|pfx|pem|key|env|map)|google-services\.json|service-account.*)$'; then
            echo '::error::Forbidden file embedded in APK.'
            exit 1
          fi
          cp "$apk" "android/app/build/outputs/apk/release/DiarySystem-v${VERSION}.apk"
          echo "$apk_cert"

      - name: Publish release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.versionCode }}
          TAG: ${{ steps.version.outputs.tag }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          apk=".source/diary-system/android/app/build/outputs/apk/release/DiarySystem-v${VERSION}.apk"
          gh release view "$TAG" >/dev/null 2>&1 && { echo '::error::Release tag already exists.'; exit 1; } || true
          sha256sum "$apk" > "${apk}.sha256"
          gh release create "$TAG" "$apk" "${apk}.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Diary System Android v${VERSION}" \
            --notes "Diary System Android

versionName: ${VERSION}
versionCode: ${VERSION_CODE}
Source commit: ${SOURCE_SHA}"

      - name: Clean temporary signing material
        if: always()
        env: {STAGE: '${{ steps.signing.outputs.stage }}'}
        run: |
          find .source -type f \( -name '*.jks' -o -name '*.keystore' -o -name '*.p12' -o -name '*.pfx' -o -name '*gpg-private*' \) -delete 2>/dev/null || true
          rm -f .source/diary-system/android/app/diary-release.jks 2>/dev/null || true
          if [ -n "$STAGE" ] && [ "$STAGE" != / ]; then rm -rf -- "$STAGE"; fi
