name: CyberRabbit OS Source Watch

on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  detect:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: cyberrabbit-os-release
    steps:
      - name: Generate Source Reader installation token
        id: source_reader
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.CYBERRABBIT_SOURCE_READER_APP_ID }}
          private-key: ${{ secrets.CYBERRABBIT_SOURCE_READER_APP_PRIVATE_KEY }}
          owner: zcx80279-collab
          repositories: Magic-Rabbit
          permission-contents: read
          permission-metadata: read

      - name: Dispatch builds only for an unseen source commit
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TOKEN: ${{ steps.source_reader.outputs.token }}
        run: |
          set -euo pipefail
          source_sha=$(GH_TOKEN="$SOURCE_TOKEN" gh api repos/zcx80279-collab/Magic-Rabbit/commits/main --jq .sha)
          releases=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100")
          android_seen=$(jq --arg sha "$source_sha" '[.[] | select((.tag_name | startswith("cyberrabbit-os/android/")) and (.body // "" | contains($sha)))] | length' <<<"$releases")
          windows_seen=$(jq --arg sha "$source_sha" '[.[] | select((.tag_name | startswith("cyberrabbit-os/windows/")) and (.body // "" | contains($sha)))] | length' <<<"$releases")
          if [ "$android_seen" -eq 0 ]; then
            gh workflow run cyberrabbit-android.yml --repo "$GITHUB_REPOSITORY" -f source_ref="$source_sha" -f version=auto -f publish=true
          fi
          if [ "$windows_seen" -eq 0 ]; then
            gh workflow run cyberrabbit-windows.yml --repo "$GITHUB_REPOSITORY" -f source_ref="$source_sha" -f version=auto -f publish=true
          fi

